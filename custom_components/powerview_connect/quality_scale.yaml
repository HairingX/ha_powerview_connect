rules:
  # Bronze
  action-setup:
    status: done
    comment: powerview_connect.set_positions is registered when the integration sets up, not per entry.
  appropriate-polling:
    status: done
    comment: >-
      The gateway's event stream says when a shade starts and stops moving. A shade is read only
      while it moves, about once a second; the whole home every 10 minutes, in case an event
      was missed. Both are options.
  brands:
    status: done
    comment: Shipped in brand/, which Home Assistant serves for custom integrations.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Logged once when the gateway stops answering and once when it answers again.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The gateway's local API has no credentials.
  test-coverage: done

  # Gold
  devices:
    status: done
    comment: The gateway, and each shade as a device connected through it.
  diagnostics: done
  discovery-update-info:
    status: done
    comment: A configured home whose primary gateway is discovered at a new address has its entry moved there.
  discovery:
    status: done
    comment: By the gateway's mDNS service, _PowerView-G3._tcp; auxiliary gateways are not offered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: When the home's shades or scenes change, the next read of the home reloads the entry to add them.
  entity-category:
    status: exempt
    comment: Every entity is a primary entity of its device.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is one a user moves or activates.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing the gateway reports needs the user to act outside the config flow.
  stale-devices:
    status: done
    comment: A shade the home no longer has loses its device when the entry sets up, which it does when the shades change.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: The client uses Home Assistant's shared aiohttp session.
  strict-typing:
    status: done
    comment: pyright strict reports no errors; the library ships py.typed.
