name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What happened, and what you expected instead. Danish is fine.
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Version of PowerView Gen 3
      description: Settings > Devices & services > PowerView Gen 3 (unofficial).
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Version of Home Assistant
      description: Settings > About.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings > Devices & services > PowerView Gen 3 (unofficial) > the three dots > Download
        diagnostics. Attach the file here. It holds every shade's type, positions and motion
        state, without the gateway's address or any serial number.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: >-
        Settings > Devices & services > PowerView Gen 3 (unofficial) > Enable debug logging, reproduce
        the problem, then Disable debug logging; the log is downloaded. Attach it here, or paste
        the lines about the problem.
      render: text
