name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # The Release and Test build workflows run these on the exact commit they publish.
  workflow_call:
    inputs:
      ref:
        description: The commit to test.
        required: true
        type: string
      branch:
        description: The branch the commit is on, when it is not main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The Python the pinned Home Assistant release requires.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # A development branch is tested with the libraries' branch of the same name, where they
      # have one, as they are developed together; such a library takes the place of its pin, which
      # need not be released yet. main is tested with what the manifest pins.
      - name: Install the test tools, Home Assistant and the libraries
        env:
          BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
        run: |
          requirements="$RUNNER_TEMP/requirements.txt"
          cp requirements-test.txt "$requirements"
          if [[ "$BRANCH" == "main" ]]; then
            echo "main: the libraries the manifest pins"
          else
            python -m pip install packaging
            python .github/scripts/test_build.py libraries "$BRANCH" > "$RUNNER_TEMP/libraries"
            while read -r requirement; do
              echo "Library: $requirement"
              grep -v -i -E "^${requirement%% *}[=<>!~ ]" "$requirements" > "$RUNNER_TEMP/kept" || true
              { cat "$RUNNER_TEMP/kept"; echo "$requirement"; } > "$requirements"
            done < "$RUNNER_TEMP/libraries"
          fi
          python -m pip install -r "$requirements"
          python -m pip show powerview_connect | grep -E '^(Name|Version):'

      - name: Type check (pyright strict)
        run: |
          pyright
          pyright -p .github/scripts

      # Live tests need a real gateway; they skip themselves without one, and are excluded here.
      # Every line of the integration is covered, and stays so.
      - name: Test
        run: >-
          python -m pytest -m "not live" -q -o log_cli=false
          --cov=custom_components.powerview --cov-report=term-missing
          --cov-fail-under=100

      - name: Test the release scripts
        run: python -m pytest .github/scripts -q -o log_cli=false
